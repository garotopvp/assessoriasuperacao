  <body>
    <div id="root"></div>
    <!-- Prevent ReferenceError from old cached bundles referencing `orderId` as a global
         and attempt to unregister any Service Workers + clear caches so clients get fresh bundles. -->
    <script>
      (function () {
        try {
          if (typeof window !== "undefined") window.orderId = window.orderId ?? null;

          if ("serviceWorker" in navigator) {
            // Unregister existing service workers (will stop serving old cached files)
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (r) {
                  try {
                    r.unregister();
                  } catch (e) {}
                });
              })
              .catch(() => {});
          }

          // Clear runtime caches created by Workbox/PWA if possible
          if (window.caches && window.caches.keys) {
            window.caches
              .keys()
              .then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return window.caches.delete(name);
                  })
                );
              })
              .catch(() => {});
          }
        } catch (e) {
          // don't break page
          console.error("SW cleanup failed", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
